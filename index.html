<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data: blob:"
    />
    <title>顔アプリ</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#0f172a">
    <style>
      body {
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
        margin: 0;
        padding: 32px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 28px;
      }
      .sub {
        color: #94a3b8;
        margin: 0 0 24px;
      }
      #layout {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 32px;
        align-items: start;
      }
      #video {
        transform: scaleX(-1);
        width: 100%;                    /* 入れ物(frame)の幅に、合わせる(100%) */
        height: auto;                   /* 縦は、比率を保って、自動 */
        display: block;                 /* 映像の下に、余計なすき間を、作らない */
      }
      #frame {
        position: relative;
        width: min(100%, 640px);        /* 画面が狭ければ、その幅。広くても、640px まで */
      }
      #overlay {
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100%;                    /* 映像と、同じ大きさにする(100%) */
        height: 100%;                   /* 映像と、同じ大きさにする(100%) */
        transform: scaleX(-1);
      }
      #instruction {
        font-size: 32px;
        line-height: 1.3;
        min-height: 2.6em;
      }
      #shot-image {
        max-width: 120px;  
      }
      @media (max-width: 700px) {        /* 画面の幅が、700px以下(スマホ)の時だけ */
        body {padding: 16px;}                 /* 余白を、小さくする(16px) */
        #layout {
          grid-template-columns: 1fr;   /* 1列にする */
          gap: 16px;
        }
      }
    </style>
  </head>
  <body>
    <h1>顔アプリ</h1>
    <p class="sub">口を開けて、歯を撮る。</p>
    <div id="layout">
      <div id="left">
        <div id="frame">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
        </div>
        <label><input type="checkbox" id="auto-save"> 撮れたら自動で保存する</label><br>
        <label><input type="checkbox" id="show-teeth"> 歯の判定を色で見る</label><br><br>
      </div>
      <div id="right">
        <p id="instruction">準備しています...</p>
        <ul id="checks"></ul>
        <p id="status">カメラを準備しています...</p>
        <progress id="hold-progress" max="1" value="0"></progress>
        <img id="shot-image" alt="撮れた写真" hidden>
        <p id="shot-saved"></p>
        <button id="again" hidden>もう一度撮る</button>
        <details>
          <summary>確認用の数字</summary>
          <p id="teeth-shot">ベストショットの取得...</p>
          <p id="teeth-info">歯の割合: 確認中...</p>
          <p id="teeth-info-2">歯の詳細情報: 確認中...</p>    
          <p id="face-info">顔: 確認中...</p>
        </details>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
